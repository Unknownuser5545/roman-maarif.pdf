<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fath Ul Mulhim Vol 01</title>
<style>
  :root {
    --toolbar-bg: #2b2b2f;
    --toolbar-fg: #e8e8ea;
    --toolbar-border: #444;
    --btn-hover: #45454a;
    --viewer-bg: #131315;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--viewer-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    padding: 0 12px;
    background: var(--toolbar-bg);
    color: var(--toolbar-fg);
    border-bottom: 1px solid var(--toolbar-border);
    font-size: 14px;
    user-select: none;
  }
  #title {
    flex: 0 0 auto;
    margin-right: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 30vw;
    color: #cfcfd2;
  }
  .tb-group { display: flex; align-items: center; gap: 2px; }
  .tb-spacer { flex: 1; }
  button.tb-btn {
    background: transparent;
    border: none;
    color: var(--toolbar-fg);
    width: 32px; height: 32px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  button.tb-btn:hover { background: var(--btn-hover); }
  button.tb-btn:disabled { opacity: 0.35; cursor: default; }
  button.tb-btn:disabled:hover { background: transparent; }
  #pageBox {
    width: 40px;
    text-align: center;
    background: #1c1c1f;
    border: 1px solid var(--toolbar-border);
    color: var(--toolbar-fg);
    border-radius: 3px;
    height: 26px;
    font-size: 13px;
  }
  #pageTotal { color: #a8a8ac; padding: 0 4px; }
  #zoomLabel { min-width: 46px; text-align: center; color: #cfcfd2; font-size: 13px; }
  a.tb-btn { text-decoration: none; }

  #viewerWrap {
    height: calc(100% - 48px);
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 24px 0 60px;
  }
  #pageImg {
    box-shadow: 0 2px 12px rgba(0,0,0,0.6);
    background: #fff;
    max-width: none;
    transform-origin: top center;
  }
</style>
</head>
<body>

<div id="toolbar">
  <div id="title">roman-maarif.pdf</div>

  <div class="tb-group">
    <button class="tb-btn" id="prevBtn" title="Previous page">&#8249;</button>
    <input id="pageBox" type="text" value="1" inputmode="numeric">
    <span id="pageTotal">/ 1</span>
    <button class="tb-btn" id="nextBtn" title="Next page">&#8250;</button>
  </div>

  <div class="tb-spacer"></div>

  <div class="tb-group">
    <button class="tb-btn" id="zoomOutBtn" title="Zoom out">&#8722;</button>
    <span id="zoomLabel">100%</span>
    <button class="tb-btn" id="zoomInBtn" title="Zoom in">+</button>
  </div>

  <div class="tb-spacer"></div>

  <a class="tb-btn" id="downloadBtn" title="Download PDF" download>&#8681;</a>
  <a class="tb-btn" id="printBtn" title="Print PDF" target="_blank" rel="noopener">&#128438;</a>
</div>

<div id="viewerWrap">
  <img id="pageImg" src="pages/p0001.webp" alt="Page 1">
</div>

<script>
(function () {
  var TOTAL_PAGES = 1; // update as more pages are added
  var PDF_FILE = 'roman-maarif.pdf';
  var state = {
    page: parseInt(localStorage.getItem('fum_page')) || 1,
    zoom: parseInt(localStorage.getItem('fum_zoom')) || 100
  };
  if (state.page < 1 || state.page > TOTAL_PAGES) state.page = 1;

  var pageImg = document.getElementById('pageImg');
  var pageBox = document.getElementById('pageBox');
  var pageTotal = document.getElementById('pageTotal');
  var zoomLabel = document.getElementById('zoomLabel');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var downloadBtn = document.getElementById('downloadBtn');
  var printBtn = document.getElementById('printBtn');
  downloadBtn.href = PDF_FILE;
  downloadBtn.setAttribute('download', PDF_FILE);
  printBtn.href = PDF_FILE + '#toolbar=1';

  function pad(n) { return String(n).padStart(4, '0'); }
  function srcFor(n) { return 'pages/p' + pad(n) + '.webp'; }

  function render() {
    pageImg.src = srcFor(state.page);
    pageImg.alt = 'Page ' + state.page;
    pageBox.value = state.page;
    pageTotal.textContent = '/ ' + TOTAL_PAGES;
    zoomLabel.textContent = state.zoom + '%';
    pageImg.style.width = (state.zoom / 100 * 1000) + 'px';
    prevBtn.disabled = state.page <= 1;
    nextBtn.disabled = state.page >= TOTAL_PAGES;
    downloadBtn.href = srcFor(state.page);
    downloadBtn.setAttribute('download', 'page-' + pad(state.page) + '.webp');
    localStorage.setItem('fum_page', state.page);
    localStorage.setItem('fum_zoom', state.zoom);
  }

  function goTo(n) {
    n = Math.max(1, Math.min(TOTAL_PAGES, n));
    state.page = n;
    render();
  }

  prevBtn.addEventListener('click', function () { goTo(state.page - 1); });
  nextBtn.addEventListener('click', function () { goTo(state.page + 1); });
  document.getElementById('zoomInBtn').addEventListener('click', function () {
    state.zoom = Math.min(300, state.zoom + 10);
    render();
  });
  document.getElementById('zoomOutBtn').addEventListener('click', function () {
    state.zoom = Math.max(30, state.zoom - 10);
    render();
  });
  pageBox.addEventListener('change', function () {
    var n = parseInt(pageBox.value);
    if (!isNaN(n)) goTo(n);
    else render();
  });

  document.addEventListener('keydown', function (e) {
    if (document.activeElement === pageBox) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo(state.page + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(state.page - 1);
    else if (e.key === '+' || e.key === '=') { state.zoom = Math.min(300, state.zoom + 10); render(); }
    else if (e.key === '-') { state.zoom = Math.max(30, state.zoom - 10); render(); }
  });

  render();
})();
</script>

</body>
</html>
